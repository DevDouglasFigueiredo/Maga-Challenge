name: Cypress tests

on: push

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test -- --browser chrome --env tags="not @skip"
        env:
          CYPRESS_GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          CYPRESS_REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          CYPRESS_REQRES_EMAIL: ${{ secrets.REQRES_EMAIL }}
          CYPRESS_REQRES_PASSWORD: ${{ secrets.REQRES_PASSWORD }}
          CYPRESS_SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          CYPRESS_SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
